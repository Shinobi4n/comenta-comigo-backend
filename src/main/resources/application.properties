spring.application.name=comenta-comigo-backend

spring.datasource.url=jdbc:postgresql://dpg-dbqdi5s9v7es73c97970-a.oregon-postgres.render.com:5432/comenta_comigo?sslmode=require&channelBinding=disable
spring.datasource.username=data
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=60000


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.localhost=localhost

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.profiles.active=local